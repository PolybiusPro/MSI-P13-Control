name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libusb-1.0-0 libhidapi-hidraw0 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libgl1
      - name: Install
        run: pip install -e ".[gui,desktop,dev]"
      - name: Type check
        run: mypy p13ctl
      - name: Tests
        run: pytest -q
